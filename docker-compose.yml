services:
  pipeline:
    build:
      context: .
      dockerfile: dockerfile
    image: metagenomic-pipeline:2.0.0
    working_dir: /pipeline
    volumes:
      - ./config:/pipeline/config:ro
      - ./data:/pipeline/data:ro
      - ./db:/pipeline/db:ro
      - ./db/krona:/opt/conda/opt/krona/taxonomy:ro
      - ./results:/pipeline/results
      - ./logs:/pipeline/logs
    command: ["snakemake", "--snakefile", "workflow/Snakefile", "--cores", "4", "--resources", "mem_mb=7000", "--printshellcmds", "--rerun-incomplete", "--show-failed-logs"]
  jupyter:
    image: metagenomic-pipeline:2.0.0
    profiles: ["interactive"]
    working_dir: /pipeline
    ports: ["8889:8888"]
    volumes:
      - ./notebooks:/pipeline/notebooks
      - ./results:/pipeline/results:ro
      - ./config:/pipeline/config:ro
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--ServerApp.token=", "--ServerApp.allow_root=True"]
